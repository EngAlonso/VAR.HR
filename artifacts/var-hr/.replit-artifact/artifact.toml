kind = "web"
previewPath = "/"
title = "VAR HR"
description = "A multilingual, multi-tenant HR operations platform for managing companies, employees, attendance, leave, permissions, reports, payroll foundations, biometric devices, and subscriptions with RTL and LTR support."
version = "1.0.0"
id = "artifacts/var-hr"

[[services]]
name = "web"
paths = [ "/" ]
router = "path"
localPort = 22077

[services.development]
run = "pnpm --filter @workspace/var-hr run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/var-hr", "run", "build" ]
serve = "static"
publicDir = "artifacts/var-hr/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22077"
BASE_PATH = "/"
