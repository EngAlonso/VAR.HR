        activity:
          type: array
          items:
            $ref: "#/components/schemas/PlatformActivity"
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/PlatformAlert"
    PlatformCompanyDetail:
      type: object
      required: [id, name, slug, timezone, currency, active, status, planName, subscriptionStatus, employeeCount, activeEmployees, userCount, activeUsers, employeeLimit, ownerCount, monthlyPrice, annualPrice, owner, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        timezone: { type: string }
        currency: { type: string }
        active: { type: boolean }
        status: { type: string }
        planName: { type: string }
        subscriptionStatus: { type: string }
        employeeCount: { type: integer }
        activeEmployees: { type: integer }
        userCount: { type: integer }
        activeUsers: { type: integer }
        employeeLimit: { type: integer }
        ownerCount: { type: integer }
        monthlyPrice: { type: number }
        annualPrice: { type: number }
        owner:
          oneOf:
            - $ref: "#/components/schemas/PlatformOwnerAccount"
            - type: "null"
        createdAt: { type: string, format: date-time }
    PlatformOwnerAccount:
      type: object
      required: [id, username, displayRole, active]
      properties:
        id: { type: string }
        username: { type: string }
        displayRole: { type: string }
        active: { type: boolean }
    PlatformActivity:
      type: object
      required: [id, action, entityType, entityId, accountId, companyId, metadata, createdAt]
      properties:
        id: { type: string }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: ["string", "null"] }
        accountId: { type: ["string", "null"] }
        companyId: { type: ["string", "null"] }
        metadata: { type: object }
        createdAt: { type: string, format: date-time }
    PlatformAlert:
      type: object
      required: [id, severity, title, detail]
      properties:
        id: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        title: { type: string }
        detail: { type: string }
