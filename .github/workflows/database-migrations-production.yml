
name: VAR HR protected Aiven production migration

on:
  workflow_dispatch:
    inputs:
      backup_verified:
        description: "Confirm that a recent, restorable backup of the Aiven database exists"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
      confirm_production_migration:
        description: "Type APPLY-0012 to authorize migrations 0011 and 0012"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: varhr-aiven-production-migration
  cancel-in-progress: false

jobs:
  migrate-aiven:
    name: Review, test, migrate, and verify Aiven
    runs-on: ubuntu-latest
    environment:
      name: aiven-production

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: var_hr_migration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d var_hr_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/var_hr_migration_test
      AIVEN_MIGRATION_DATABASE_URL: ${{ secrets.AIVEN_MIGRATION_DATABASE_URL }}
      AIVEN_CA_CERT: ${{ secrets.AIVEN_CA_CERT }}

    steps:
      - name: Check out reviewed code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production authorization and secrets
        shell: bash
        env:
          BACKUP_VERIFIED: ${{ inputs.backup_verified }}
          PRODUCTION_CONFIRMATION: ${{ inputs.confirm_production_migration }}
        run: |
          if [[ "$BACKUP_VERIFIED" != "yes" ]]; then
            echo "::error::Migration blocked: a recent restorable backup must be confirmed."
            exit 1
          fi

          if [[ "$PRODUCTION_CONFIRMATION" != "APPLY-0012" ]]; then
            echo "::error::Migration blocked: confirmation must match APPLY-0012 exactly."
            exit 1
          fi

          if [[ -z "$AIVEN_MIGRATION_DATABASE_URL" ]]; then
            echo "::error::Missing GitHub Environment secret AIVEN_MIGRATION_DATABASE_URL."
            exit 1
          fi

          if [[ -z "$AIVEN_CA_CERT" ]]; then
            echo "::error::Missing GitHub Environment secret AIVEN_CA_CERT."
            exit 1
          fi

          if [[ "$AIVEN_MIGRATION_DATABASE_URL" != *".aivencloud.com"* ]]; then
            echo "::error::The configured database URL is not an Aiven host."
            exit 1
          fi

          echo "Authorization and required secrets verified."

      - name: Inspect live Aiven schema (read-only)
        run: pnpm --filter @workspace/db run inspect:aiven

      - name: Require reviewed 0010 baseline and repository migrations through 0012
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const p = JSON.parse(
            fs.readFileSync(
              "lib/db/migrations/meta/aiven-baseline-report.json",
              "utf8"
            )
          );

          if (p.status !== "baselined") {
            throw new Error("Aiven baseline is not current. Production migration blocked.");
          }

          if (p.databaseName !== "defaultdb") {
            throw new Error("Unexpected Aiven database name. Review target before proceeding.");
          }

          if (p.matchingSnapshotMigration?.tag !== "0010_acoustic_sway") {
            throw new Error("Aiven is not at the reviewed 0010 starting schema. No migration will run.");
          }

          if (p.latestRepositoryMigration?.tag !== "0012_employee_attendance_location_mode") {
            throw new Error("Repository latest migration is not 0012_employee_attendance_location_mode.");
          }

          if (!p.migrationLedger?.exists) {
            throw new Error("Aiven Drizzle migration ledger is missing.");
          }

          if (!p.migrationLedger.entries?.some(
            entry => entry.hash === p.baselineMigration?.hash
          )) {
            throw new Error("The reviewed baseline migration is missing from Aiven's ledger.");
          }

          console.log("Verified Aiven starting point at 0010. Pending migrations will be tested before production.");
          NODE

      - name: Bootstrap and apply pending migrations on disposable PostgreSQL
        run: pnpm --filter @workspace/db run migrate:dev

      - name: Verify disposable PostgreSQL reached migration 0012
        run: pnpm --filter @workspace/db run inspect:dev

      - name: Apply development-tested migrations to Aiven
        run: pnpm --filter @workspace/db exec node ./scripts/migration-control.mjs migrate:aiven --confirm-aiven-production

      - name: Verify Aiven schema and migration ledger after migration
        run: |
          pnpm --filter @workspace/db run inspect:aiven

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const p = JSON.parse(
            fs.readFileSync(
              "lib/db/migrations/meta/aiven-baseline-report.json",
              "utf8"
            )
          );

          if (p.status !== "baselined") {
            throw new Error("Post-migration Aiven baseline verification failed.");
          }

          if (p.matchingSnapshotMigration?.tag !== "0012_employee_attendance_location_mode") {
            throw new Error("Aiven schema does not match migration 0012.");
          }

          const latest = p.latestRepositoryMigration;

          if (latest?.tag !== "0012_employee_attendance_location_mode") {
            throw new Error("Repository latest migration is not 0012.");
          }

          if (!p.migrationLedger?.exists ||
              !p.migrationLedger.entries?.some(entry => entry.hash === latest.hash)) {
            throw new Error("Migration 0012 is missing from Aiven's migration ledger.");
          }

          const modeColumn = p.columns?.find(
            column =>
              column.table_name === "var_hr_employees" &&
              column.column_name === "attendance_location_mode"
          );

          if (
            !modeColumn ||
            modeColumn.data_type !== "text" ||
            modeColumn.not_null !== true ||
            modeColumn.default_value !== "'fixed'::text"
          ) {
            throw new Error("attendance_location_mode is missing or has an unexpected definition.");
          }

          const modeConstraint = p.constraints?.find(
            constraint =>
              constraint.table_name === "var_hr_employees" &&
              constraint.constraint_name === "var_hr_employees_attendance_location_mode_chk"
          );

          if (!modeConstraint) {
            throw new Error("Attendance location mode check constraint is missing.");
          }

          console.log("SUCCESS: Aiven is migrated through 0012.");
          console.log("Verified: attendance_location_mode column and check constraint exist.");
          console.log("Verified: migration 0012 is recorded in the Aiven migration ledger.");
          NODE
