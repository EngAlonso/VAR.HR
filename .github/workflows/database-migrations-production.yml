name: VAR HR protected Aiven production migration

on:
  workflow_dispatch:
    inputs:
      backup_verified:
        description: "Confirm that a recent, restorable backup of the Aiven database exists"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
      confirm_production_migration:
        description: "Type APPLY-0014 to authorize the pending production migration"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: varhr-aiven-production-migration
  cancel-in-progress: false

jobs:
  migrate-aiven:
    name: Review, test, migrate, and verify Aiven
    runs-on: ubuntu-latest
    environment:
      name: aiven-production

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: var_hr_migration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d var_hr_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/var_hr_migration_test
      AIVEN_MIGRATION_DATABASE_URL: ${{ secrets.AIVEN_MIGRATION_DATABASE_URL }}
      AIVEN_CA_CERT: ${{ secrets.AIVEN_CA_CERT }}

    steps:
      - name: Check out reviewed code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production authorization and secrets
        shell: bash
        env:
          BACKUP_VERIFIED: ${{ inputs.backup_verified }}
          PRODUCTION_CONFIRMATION: ${{ inputs.confirm_production_migration }}
        run: |
          if [[ "$BACKUP_VERIFIED" != "yes" ]]; then
            echo "::error::Migration blocked: a recent restorable backup must be confirmed."
            exit 1
          fi

          if [[ "$PRODUCTION_CONFIRMATION" != "APPLY-0014" ]]; then
            echo "::error::Migration blocked: confirmation must match APPLY-0014 exactly."
            exit 1
          fi

          if [[ -z "$AIVEN_MIGRATION_DATABASE_URL" ]]; then
            echo "::error::Missing GitHub Environment secret AIVEN_MIGRATION_DATABASE_URL."
            exit 1
          fi

          if [[ -z "$AIVEN_CA_CERT" ]]; then
            echo "::error::Missing GitHub Environment secret AIVEN_CA_CERT."
            exit 1
          fi

          if [[ "$AIVEN_MIGRATION_DATABASE_URL" != *".aivencloud.com"* ]]; then
            echo "::error::The configured database URL is not an Aiven host."
            exit 1
          fi

          echo "Authorization and required secrets verified."

      # Read-only: inspect the actual live production schema and ledger.
      - name: Inspect live Aiven schema (read-only)
        run: pnpm --filter @workspace/db run inspect:aiven

      # Attest the exact live 0013 starting point; do not rewrite the ledger.
      - name: Verify Aiven is exactly at migration 0013
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const reportPath = "lib/db/migrations/meta/aiven-baseline-report.json";
          const p = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          const fail = (message) => {
            throw new Error(`${message} No production migration will run.`);
          };

          if (p.databaseName !== "defaultdb") fail("Unexpected Aiven database name.");
          if (p.columnsMatchKnownSnapshot !== true) fail("Aiven does not match a known Drizzle snapshot.");
          if (p.comparison?.matches !== true) fail("Aiven schema comparison did not pass.");
          if (p.matchingSnapshotMigration?.tag !== "0012_employee_attendance_location_mode") {
            fail("Aiven schema is not exactly at the 0012 snapshot.");
          }
          if (p.latestRepositoryMigration?.tag !== "0014_biometric_device_commands") {
            fail("Repository latest migration is not 0014.");
          }

          const ledger = p.migrationLedger;
          const entries = ledger?.entries;
          if (ledger?.exists !== true || !Array.isArray(entries) || entries.length < 1) {
            fail("Aiven migration ledger is missing or empty.");
          }

          const last = entries.at(-1);
          const snapshot = p.matchingSnapshotMigration;
          if (
            last?.hash !== snapshot.hash ||
            String(last?.created_at) !== String(snapshot.createdAt)
          ) {
            fail("Aiven ledger latest entry does not match the live 0013 schema snapshot.");
          }

          // Preserve the fingerprint from the live read-only inspection.
          // migrate:aiven rechecks it immediately before executing DDL.
          p.status = "baselined";
          p.baselinedAt = new Date().toISOString();
          p.baselineMigration = {
            tag: snapshot.tag,
            createdAt: Number(snapshot.createdAt),
            hash: snapshot.hash
          };
          fs.writeFileSync(reportPath, JSON.stringify(p, null, 2) + "\n");

          console.log("Verified Aiven database: defaultdb.");
          console.log("Verified live schema matches migration 0012.");
          console.log("Verified latest ledger entry matches the 0012 snapshot.");
          console.log("Migrations 0013 and 0014 are eligible for production, subject to Dev verification.");
          NODE

      # Run the complete committed migration chain on disposable PostgreSQL.
      - name: Apply all migrations on disposable PostgreSQL
        run: pnpm --filter @workspace/db run migrate:dev

      - name: Verify disposable PostgreSQL reached migration 0014
        run: pnpm --filter @workspace/db run inspect:dev

      # This command independently checks the Aiven fingerprint and verifies
      # that every pending migration has already been applied on disposable Dev.
      - name: Apply development-tested migrations to Aiven
        run: pnpm --filter @workspace/db exec node ./scripts/migration-control.mjs migrate:aiven --confirm-aiven-production

      - name: Verify Aiven schema and migration ledger after migration
        shell: bash
        run: |
          pnpm --filter @workspace/db run inspect:aiven

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const reportPath = "lib/db/migrations/meta/aiven-baseline-report.json";
          const p = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          const fail = (message) => {
            throw new Error(`Post-migration verification failed: ${message}`);
          };

          if (p.databaseName !== "defaultdb") fail("Unexpected Aiven database name.");
          if (p.status !== "baselined") fail("Aiven baseline attestation is not current.");
          if (p.matchingSnapshotMigration?.tag !== "0014_biometric_device_commands") {
            fail("Aiven schema does not match migration 0014.");
          }
          if (p.comparison?.matches !== true) fail("Aiven schema does not match the 0014 snapshot.");
          if (p.latestRepositoryMigration?.tag !== "0014_biometric_device_commands") {
            fail("Repository latest migration is not 0014.");
          }

          const latest = p.latestRepositoryMigration;
          const ledger = p.migrationLedger;
          const last = ledger?.entries?.at(-1);
          if (
            ledger?.exists !== true ||
            !last ||
            last.hash !== latest.hash ||
            String(last.created_at) !== String(latest.createdAt)
          ) {
            fail("Migration 0014 is not the latest entry in Aiven's migration ledger.");
          }

          const tableColumns = p.columns?.filter(
            (column) => column.table_name === "var_hr_biometric_device_commands"
          ) ?? [];
          const requiredColumns = [
            "id", "command_number", "company_id", "device_id", "sync_history_id",
            "command", "status", "result", "created_at", "sent_at", "completed_at"
          ];
          for (const name of requiredColumns) {
            if (!tableColumns.some((column) => column.column_name === name)) {
              fail(`Missing var_hr_biometric_device_commands.${name}.`);
            }
          }

          console.log("SUCCESS: Aiven is migrated through 0014.");
          console.log("Verified biometric device commands table and all 11 columns.");
          console.log("Verified migration 0014 is the latest Aiven ledger entry.");
          NODE
