name: VAR HR protected Aiven production migration

on:
  workflow_dispatch:
    inputs:
      backup_verified:
        description: "Confirm that a recent, restorable backup of the Aiven database exists"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
      confirm_production_migration:
        description: "Type APPLY-0011 to authorize the production migration"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: varhr-aiven-production-migration
  cancel-in-progress: false

jobs:
  migrate-aiven:
    name: Review, test, migrate, and verify Aiven
    runs-on: ubuntu-latest
    environment:
      name: aiven-production
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: var_hr_migration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d var_hr_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/var_hr_migration_test
      AIVEN_MIGRATION_DATABASE_URL: ${{ secrets.AIVEN_MIGRATION_DATABASE_URL }}
      AIVEN_CA_CERT: ${{ secrets.AIVEN_CA_CERT }}
    steps:
      - name: Check out reviewed code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate explicit production authorization and secrets
        shell: bash
        env:
          BACKUP_VERIFIED: ${{ inputs.backup_verified }}
          PRODUCTION_CONFIRMATION: ${{ inputs.confirm_production_migration }}
        run: |
          if [[ "$BACKUP_VERIFIED" != "yes" ]]; then
            echo "::error::Production migration blocked: select 'yes' only after confirming a recent, restorable Aiven backup."
            exit 1
          fi
          if [[ "$PRODUCTION_CONFIRMATION" != "APPLY-0011" ]]; then
            echo "::error::Production migration blocked: confirmation must match APPLY-0011 exactly."
            exit 1
          fi
          if [[ -z "$AIVEN_MIGRATION_DATABASE_URL" ]]; then
            echo "::error::Production migration blocked: GitHub Environment secret AIVEN_MIGRATION_DATABASE_URL is missing or unavailable."
            exit 1
          fi
          if [[ -z "$AIVEN_CA_CERT" ]]; then
            echo "::error::Production migration blocked: GitHub Environment secret AIVEN_CA_CERT is missing or unavailable."
            exit 1
          fi
          if [[ "$AIVEN_MIGRATION_DATABASE_URL" != *".aivencloud.com"* ]]; then
            echo "::error::Production migration blocked: AIVEN_MIGRATION_DATABASE_URL does not point to an Aiven host."
            exit 1
          fi
          echo "Authorization inputs and required secrets are present. Continuing with read-only baseline checks.";

      - name: Inspect live Aiven schema (read-only)
        run: pnpm --filter @workspace/db run inspect:aiven

      - name: Require the reviewed Aiven baseline and exact 0010 starting point
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const p = JSON.parse(fs.readFileSync("lib/db/migrations/meta/aiven-baseline-report.json", "utf8"));
          if (p.status !== "baselined") throw new Error("Aiven baseline is not current; production migration blocked.");
          if (p.databaseName !== "defaultdb") throw new Error("Unexpected Aiven database name; review target before proceeding.");
          if (p.matchingSnapshotMigration?.tag !== "0010_acoustic_sway") throw new Error("Aiven is not exactly at the reviewed 0010 baseline; no migration will run.");
          if (p.latestRepositoryMigration?.tag !== "0011_flexible_work_schedules") throw new Error("Repository latest migration is not 0011_flexible_work_schedules.");
          if (!p.migrationLedger?.exists) throw new Error("Aiven Drizzle migration ledger is missing.");
          console.log("Aiven schema matches the reviewed 0010 baseline. Proceeding to disposable test.");
          NODE

      - name: Bootstrap and apply all pending migrations on disposable PostgreSQL
        run: pnpm --filter @workspace/db run migrate:dev

      - name: Verify disposable PostgreSQL reached migration 0011
        run: pnpm --filter @workspace/db run inspect:dev

      - name: Apply development-tested migration(s) to Aiven
        run: pnpm --filter @workspace/db exec node ./scripts/migration-control.mjs migrate:aiven --confirm-aiven-production

      - name: Verify Aiven schema and migration ledger after migration
        run: |
          pnpm --filter @workspace/db run inspect:aiven
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const p = JSON.parse(fs.readFileSync("lib/db/migrations/meta/aiven-baseline-report.json", "utf8"));
          if (p.status !== "baselined") throw new Error("Post-migration Aiven baseline verification failed.");
          if (p.matchingSnapshotMigration?.tag !== "0011_flexible_work_schedules") throw new Error("Aiven schema does not match migration 0011.");
          if (!p.migrationLedger?.entries?.some((entry) => entry.hash === p.latestRepositoryMigration?.hash)) throw new Error("Migration 0011 is missing from the Aiven migration ledger.");
          const shiftType = p.columns?.find((column) => column.table_name === "var_hr_work_schedules" && column.column_name === "shift_type");
          if (!shiftType || shiftType.data_type !== "text" || shiftType.not_null !== true) throw new Error("Expected shift_type column is missing or has the wrong type.");
          console.log("Verified: Aiven schema and migration ledger are current through 0011; shift_type is present.");
          NODE
