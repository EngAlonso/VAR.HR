name: VAR HR database migration CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  test-migrations:
    name: Test migrations on disposable PostgreSQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: var_hr_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d var_hr_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck project
        run: pnpm run typecheck

      - name: Verify schema changes have committed migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/var_hr_ci
        run: |
          pnpm --filter @workspace/db run generate
          if [ -n "$(git status --porcelain -- lib/db/migrations)" ]; then
            echo "::error::Generated migration files differ from the committed files. Review and commit the generated changes."
            git status --short -- lib/db/migrations
            exit 1
          fi

      - name: Apply migrations to disposable PostgreSQL only
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/var_hr_ci
        run: pnpm --filter @workspace/db run migrate:dev

      - name: Inspect disposable PostgreSQL schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/var_hr_ci
        run: pnpm --filter @workspace/db run inspect:dev
