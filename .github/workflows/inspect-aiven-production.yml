name: Inspect Aiven Production (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-aiven:
    name: Inspect Live Aiven Schema
    runs-on: ubuntu-latest
    environment:
      name: aiven-production
    env:
      AIVEN_MIGRATION_DATABASE_URL: ${{ secrets.AIVEN_MIGRATION_DATABASE_URL }}
      AIVEN_CA_CERT: ${{ secrets.AIVEN_CA_CERT }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inspect live Aiven schema (read-only)
        run: pnpm --filter @workspace/db run inspect:aiven
